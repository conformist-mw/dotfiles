---
# --- router: the Keenetic web UI ---------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: router
  namespace: external
spec:
  ports:
    - { name: http, port: 80, targetPort: 80 }
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: router
  namespace: external
  labels:
    kubernetes.io/service-name: router
addressType: IPv4
ports:
  - { name: http, port: 80, protocol: TCP }
endpoints:
  - addresses: ["192.168.1.1"]
    conditions: { ready: true }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: router
  namespace: external
spec:
  ingressClassName: traefik
  rules:
    - host: router.bee.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: router
                port:
                  number: 80
