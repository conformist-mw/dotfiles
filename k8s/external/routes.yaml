  name: cockpit
  namespace: external
  labels:
    kubernetes.io/service-name: cockpit
addressType: IPv4
ports:
  - { name: http, port: 9090, protocol: TCP }
endpoints:
  - addresses: ["10.42.0.1"]                     # the node, on cni0 — see the header
    conditions: { ready: true }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cockpit
  namespace: external
spec:
  ingressClassName: traefik
  rules:
    - host: cockpit.bee.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cockpit
                port:
                  number: 9090
---
# --- home assistant: KVM/QEMU guest on bee, stays a VM (see docs/k3s-learning.md) ---
apiVersion: v1
kind: Service
metadata:
  name: ha
  namespace: external
spec:
  ports:
    - { name: http, port: 8123, targetPort: 8123 }
---
apiVersion: discovery.k8s.io/v1
