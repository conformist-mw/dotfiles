  name: ha
  namespace: external
  labels:
    kubernetes.io/service-name: ha
addressType: IPv4
ports:
  - { name: http, port: 8123, protocol: TCP }
endpoints:
  - addresses: ["192.168.1.223"]   # the HAOS guest
    conditions: { ready: true }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ha
  namespace: external
spec:
  ingressClassName: traefik
  rules:
