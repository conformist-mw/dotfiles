# immich postgres — VectorChord image, honest swap onto the EXISTING data dir.
# The image runs its entrypoint as root and drops to postgres (uid 999); the data
# dir is owned 999:0, so NO securityContext (mirrors the docker container, which had
# no `user:` override). Same image + same immich version => no schema migration, no
# vector reindex.
#
# ⚠️ SINGLE WRITER: the docker `immich_database` container MUST be stopped before this
# pod starts. Two postgres on one data dir = corruption.
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-pgdata
spec:
  capacity: { storage: 20Gi }         # nominal; hostPath ignores it, PVC just needs a match
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain   # deleting the PVC never touches the data
  storageClassName: ""                # static bind, keep local-path-provisioner out
  hostPath:
    path: /home/user/homelab_data/immich/postgres/data
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-pgdata
  namespace: immich
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  volumeName: immich-pgdata           # bind to the PV above explicitly
  resources: { requests: { storage: 20Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-database
  namespace: immich
  labels: { app: immich-database }
spec:
  replicas: 1
  strategy: { type: Recreate }        # never two postgres on the same data dir
  selector:
    matchLabels: { app: immich-database }
  template:
    metadata:
      labels: { app: immich-database }
    spec:
      enableServiceLinks: false   # see server.yaml — no need for the docker-link env vars
      initContainers:
        # Refuse to start unless the hostPath really holds the existing cluster.
        # `hostPath: type: Directory` only proves the path EXISTS — if it were empty or
        # pointed somewhere wrong, the postgres entrypoint would happily initdb a brand
        # new cluster and immich would migrate into it, leaving a silently empty library
        # next to untouched photos on disk. Failing closed is the cheaper outcome.
        # ⚠️ This makes these manifests adoption-only. To bootstrap an EMPTY data dir
        # (fresh rehearsal box), drop this initContainer for the first start.
        - name: assert-pgdata
          image: ghcr.io/immich-app/postgres:16-vectorchord0.4.3-pgvectors0.2.0
          command:
            - sh
            - -c
            - |
              test -f /var/lib/postgresql/data/PG_VERSION || {
                echo "PGDATA has no PG_VERSION — refusing to start so postgres cannot initdb over it." >&2
                exit 1
              }
              echo "PGDATA adopted, PG_VERSION=$(cat /var/lib/postgresql/data/PG_VERSION)"
          volumeMounts:
            - { name: pgdata, mountPath: /var/lib/postgresql/data }
      containers:
        - name: postgres
          image: ghcr.io/immich-app/postgres:16-vectorchord0.4.3-pgvectors0.2.0
          env:
            - { name: POSTGRES_PASSWORD, value: "immich" }
            - { name: POSTGRES_USER, value: "immich" }
            - { name: POSTGRES_DB, value: "immich" }
            - { name: POSTGRES_INITDB_ARGS, value: "--data-checksums" }
          ports:
            - containerPort: 5432
          volumeMounts:
            - { name: pgdata, mountPath: /var/lib/postgresql/data }
            - { name: shm, mountPath: /dev/shm }   # docker had shm_size: 128M
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "immich", "-d", "immich"] }
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: pgdata
          persistentVolumeClaim: { claimName: immich-pgdata }
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: immich-database      # server connects here (DB_HOSTNAME=immich-database)
  namespace: immich
spec:
  selector: { app: immich-database }
  ports:
    - { port: 5432, targetPort: 5432 }
