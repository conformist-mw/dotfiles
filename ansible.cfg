[defaults]
inventory=inventory.yml
# auto-load + auto-decrypt secrets from group_vars/ and host_vars/ (community.sops vars plugin)
vars_plugins_enabled=host_group_vars,community.sops.sops

[diff]
# show line-by-line diffs for copy/template tasks on every run (like running with --diff)
# A diff prints secrets verbatim (container env, rendered configs), so every
# task that writes a sops value sets `diff: false`; a new one must too.
always = True
context = 3
