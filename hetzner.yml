- hosts: hetzner
  roles:
    # Base system setup
    - { role: common, tags: [base, common] }
    - { role: vps, tags: [base, vps] }
    - {
        role: docker,
        tags: [base, docker],
        vars: { ansible_distribution_release: "bookworm" },
      }
    - { role: vim, tags: [base, vim] }
    - { role: vim, tags: [base, vim-root], vars: { user: "root" } }
    - { role: speedtest, tags: [base, speedtest] }
    - { role: wireguard, tags: [base, wireguard] }
    # watchtower intentionally disabled: image updates move to renovate (manual PRs)
    # ahead of the k3s migration. Role kept in roles/ for reference. Container removed
    # from the host manually. See MIGRATION.md.

    # Infrastructure
    # Before traefik: a name that doesn't resolve yet still gets a certificate
    # (dns-01 talks to the zone), so a missing record shows up as an app that is
    # simply unreachable, with nothing in the logs to say so.
    - { role: dns, tags: [infra, dns] }
    - { role: traefik-vps, tags: [infra, traefik] }
    - { role: tinyauth, tags: [infra, tinyauth] }
    - { role: pihole, tags: [infra, pihole] }
    - { role: crowdsec, tags: [infra, crowdsec] }
    - { role: crowdsec-web-ui, tags: [infra, crowdsec-web-ui] }

    # Applications
    - { role: dozzle, tags: [apps, dozzle] }
    - { role: glances, tags: [apps, glances] }
    - {
        role: homepage,
        tags: [apps, homepage],
        vars:
          {
            hostname_prefix: "dash.",
            path_prefix: "vps/",
            # CrowdSec runs natively on this host, so the dashboard's widget can
            # have a LAPI watcher of its own. Absent on bee, where the role
            # skips provisioning it.
            homepage_crowdsec_machine: "homepage",
          },
      }
    - { role: commeilfaut, tags: [apps, commeilfaut] }
    - { role: segments, tags: [apps, segments] }
    # home-meters is gone: its addresses/tariffs/readings now live in
    # family-hub's own database, which the nightly snapshot already covers.
    - { role: family-hub, tags: [apps, family-hub, "family_hub"] }
    - { role: school-bot, tags: [apps, school-bot, "school_bot"] }
    - { role: subtrackr, tags: [apps, subtrackr] }
    - { role: mealie, tags: [apps, mealie] }

    # Snapshots whatever host_vars/hetzner/backup.yml lists, so it runs after
    # the apps that write those files.
    - { role: vps-backup, tags: [apps, backup, "vps_backup"] }

    # Monitoring
    - { role: beszel, tags: [apps, monitoring, beszel] }
    - { role: gatus, tags: [apps, monitoring, gatus] }
