---
# What the vps-backup role snapshots. Paths are on the host, not inside a
# container — the role reads the files the containers write.
vps_backup_sqlite:
  - name: family-hub
    path: "{{ data_dir }}/family-hub/family-hub.db"
  - name: subtrackr
    path: "{{ data_dir }}/subtrackr/subtrackr.db"

# openGym keeps everything as plain files (profiles, passkeys, history,
# uploads, the session secret), so the whole directory is the backup.
vps_backup_dirs:
  - name: opengym
    path: "{{ data_dir }}/opengym"
