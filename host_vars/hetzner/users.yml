---
# Human logins on the VPS beyond the ansible deploy user (vps_user).
# Created by the `vps` role. SSH *public* keys are not secret (GitHub serves
# them at github.com/<user>.keys), so they live here in plaintext, not SOPS.
#
# Shape of an entry:
#   - name: alice
#     uid: 1010
#     gid: 1010
#     groups: []          # never `docker`: that is root on the host by another name
#     shell: /bin/bash
#     ssh_key: "ssh-ed25519 AAAA…"
#     data_dir: /home/alice/data   # optional, created + chowned by the vps role
#     apps: [container, …]         # optional, installs appctl for these containers
#
# Removing an entry does not delete the account on the host (the role only
# creates); `userdel -r <name>` it by hand.
vps_users: []
