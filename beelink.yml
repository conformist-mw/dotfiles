- hosts: bee
  handlers:
    - import_tasks: handlers/main.yml
  roles:
    # Base system setup
    - { role: common, tags: [base, common] }
    - { role: beelink, tags: [base, beelink] }
    - { role: docker, tags: [base, docker] }
    - { role: vim, tags: [base, vim] }
    - { role: vim, tags: [base, vim-root], vars: { user: "root" } }
    # Ookla has no ubuntu/noble repo yet; jammy debs run fine on noble.
    - {
        role: speedtest,
        tags: [base, speedtest],
        vars: { ansible_distribution_release: "jammy" },
      }
    # watchtower intentionally disabled: image updates move to renovate (manual PRs)
    # ahead of the k3s migration. Role kept in roles/ for reference. Container removed
    # from the host manually. See MIGRATION.md.

    # Infrastructure
    # k3s migration paused: the service is stopped + disabled on bee (only the
    # whoami/ingress pilots ran there), binaries and /var/lib/rancher kept. The role
    # would start and enable it again — uncomment when the migration resumes.
    # - { role: k3s, tags: [infra, k3s] }
    - { role: traefik, tags: [infra, traefik] }
    - { role: cockpit, tags: [infra, cockpit] }

    # Applications
    - { role: samba, tags: [apps, samba] }
    - { role: jellyfin, tags: [apps, jellyfin] }
    - { role: navidrome, tags: [apps, navidrome] }
    - { role: dozzle, tags: [apps, dozzle] }
    - { role: torrent, tags: [apps, torrent] }
    - { role: sponsorblock, tags: [apps, sponsorblock] }
    # Agent only (host_vars/bee/beszel.yml); the hub on hetzner connects over WireGuard.
    - { role: beszel, tags: [apps, monitoring, beszel] }
    # HA moved to its own Raspberry Pi (HAOS on SSD, same IP .223). The role would
    # restart the old `hass` VM — kept shut off as a cold fallback — and put a second
    # HA on the SLZB socket. Keep it out until the VM is deleted for good.
    # - { role: homeassistant, tags: [apps, homeassistant] }
    - { role: grist, tags: [apps, grist] }
    - { role: grist_etl, tags: [apps, grist_etl] }
    - { role: homepage, tags: [apps, homepage] }
    # immich pulls in redis via its meta dependency (roles/immich/meta/main.yml)
    - { role: immich, tags: [apps, immich] }
    - { role: backup, tags: [apps, backup] }
