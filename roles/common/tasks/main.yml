---
- name: Install common system packages
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - bash-completion
      - btop
      - curl
      - debian-archive-keyring
      - fd-find
      - gdu
      - htop
      - libacl1
      - libacl1-dev
      - liblz4-dev
      - libssl-dev
      - libxxhash-dev
      - libzstd-dev
      - mc
      - ncdu
      - plocate
      - python3-dev
      - python3-pip
      - python3-psycopg2
      - ranger
      - virtualenv
    update_cache: yes
    state: present
  become: true

- name: Cap the systemd journal
  block:
    # Neither host had this directory — the packages ship only journald.conf.
    - name: Ensure the journald drop-in dir exists
      ansible.builtin.file:
        path: /etc/systemd/journald.conf.d
        state: directory
        mode: "0755"

    - name: Write the journald size limits
      # A drop-in, not an edit of journald.conf: the packaged file stays untouched,
      # so what this repo owns is one file to read and one file to delete.
      ansible.builtin.copy:
        dest: /etc/systemd/journald.conf.d/99-homelab.conf
        mode: "0644"
        content: |
          [Journal]
          SystemMaxUse={{ journal_max_use }}
          SystemMaxFileSize={{ journal_max_file_size }}
          MaxRetentionSec={{ journal_max_retention }}
      notify: Restart journald

    # SystemMaxUse is only enforced when journald next rotates, so on a host that
    # has been over the limit for months the config change on its own frees
    # nothing. This also clears the truncated `.journal~` files an unclean
    # shutdown leaves behind — journald keeps those but never rotates them away
    # (12 of them, 209M, on bee).
    - name: Vacuum the journal down to the limit
      ansible.builtin.command: "journalctl --vacuum-size={{ journal_max_use }}"
      register: journal_vacuum
      changed_when: "'Deleted archived journal' in journal_vacuum.stderr"
  become: true

- name: Apply security updates unattended
  block:
    - name: Install unattended-upgrades
      ansible.builtin.apt:
        name:
          - unattended-upgrades
        state: present

    # Two files because the package splits the job: 20auto-upgrades decides
    # whether the timers do anything at all, 50unattended-upgrades decides what
    # they are allowed to install. Neither is edited — the package keeps its own
    # copies and this repo owns one drop-in that sorts last and wins.
    - name: Enable the periodic apt timers
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        mode: "0644"
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
          APT::Periodic::AutocleanInterval "7";

    - name: Write the unattended-upgrades policy
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/99-homelab-unattended
        mode: "0644"
        content: |
          // Managed by ansible (roles/common). Sorts after 50unattended-upgrades.
          //
          // #clear first: an apt.conf list block APPENDS, so without this the
          // package's own origins stay in force and this file stops describing
          // what is actually allowed. Verified — the release pocket was still
          // listed until the clear was added.
          #clear Unattended-Upgrade::Allowed-Origins;
          Unattended-Upgrade::Allowed-Origins {
                  "${distro_id}:${distro_codename}-security";
                  "${distro_id}ESMApps:${distro_codename}-apps-security";
                  "${distro_id}ESM:${distro_codename}-infra-security";
          {% if not unattended_security_only %}
                  "${distro_id}:${distro_codename}-updates";
          {% endif %}
          };
          Unattended-Upgrade::Automatic-Reboot "{{ unattended_automatic_reboot | ternary('true', 'false') }}";
          Unattended-Upgrade::Mail "{{ unattended_mail }}";
          Unattended-Upgrade::MailReport "{{ unattended_mail_report }}";
          // /boot is small and four kernels were already installed on bee.
          Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
          Unattended-Upgrade::Remove-Unused-Dependencies "true";
          // Keep going if a package is mid-download when the run is cut short.
          Unattended-Upgrade::MinimalSteps "true";

    # The policy is only worth what a dry run says it is: this prints the
    # packages that WOULD be taken, so a wrong origin shows up here rather than
    # as a surprise a week later. Never installs anything.
    - name: Verify the policy resolves
      ansible.builtin.command: unattended-upgrade --dry-run --debug
      register: unattended_check
      changed_when: false
      failed_when: unattended_check.rc != 0
  become: true

- name: Install tg-sendmail for notifications
  block:
    - name: Install tg-sendmail deb
      # 0.4.0 replaced the one arch-independent _all.deb with per-arch assets, so the
      # architecture is derived the way the speedtest role already does it. apt refuses
      # to go backwards, so leaving this behind the installed version fails the whole
      # role rather than being a quiet no-op.
      ansible.builtin.apt:
        deb: "https://github.com/conformist-mw/sendmail/releases/download/{{ tg_sendmail_version }}/tg-sendmail_{{ tg_sendmail_version }}_{{ [ansible_architecture] | map('extract', deb_architecture) | first }}.deb"
      vars:
        deb_architecture: { "aarch64": "arm64", "x86_64": "amd64" }

    - name: Install mailx
      ansible.builtin.apt:
        name: bsd-mailx

    - name: Copy tg sendmail config
      # 0.4.0 moved the config from /etc/tg-sendmail.ini to /etc/tg-sendmail.yaml and
      # changed its shape; the old path is simply not read any more. Neither host has
      # an .ini left, so there is nothing to clean up — only the new file to own.
      ansible.builtin.copy:
        dest: /etc/tg-sendmail.yaml
        # 0644, not 0600: /usr/sbin/sendmail is not setuid, so it runs as whoever
        # invoked it and has to read this itself. Tightening it to root-only makes
        # every unprivileged `mailx` fail with "permission denied" (error code 78).
        mode: "0644"
        content: |
          log:
            level: info
            path: /var/log/tg-sendmail.log
          telegram:
            bot_token: "{{ telegram_alerts_bot_token }}"
            chat_id: "{{ telegram_alerts_chat_id }}"
  become: true

- name: Create systemd-notify service
  block:
    - name: Copy systemd-notify service
      ansible.builtin.copy:
        dest: /etc/systemd/system/systemd-notify@.service
        content: |
          [Unit]
          Description=Send systemd notifications to Telegram
          After=network.target

          [Service]
          Type=oneshot
          ExecStart=/usr/bin/bash -c '/usr/bin/systemctl status %i | /usr/bin/mailx -s "[SYSTEMD_%i] Fail" root@{{ ansible_host }}'

          [Install]
          WantedBy=multi-user.target

    - name: Enable notify service
      ansible.builtin.systemd:
        daemon_reload: yes
  become: true

- name: Create data directory
  ansible.builtin.file:
    path: "{{ data_dir }}"
    state: directory

- name: Configure sysctl for IP forwarding
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "1"
    sysctl_set: true
    state: present
    reload: yes
  with_items:
    - "net.ipv4.ip_forward"
    - "net.ipv4.conf.lo.route_localnet"
    - "net.ipv4.conf.{{ docker_network }}.route_localnet"
  become: true
