http:
  routers:
    ha:
      entryPoints:
        - web
      service: ha
      rule: Host(`ha.{{ ansible_host }}`)
    router:
      entryPoints:
        - web
      service: router
      rule: Host(`router.{{ ansible_host }}`)

  services:
    ha:
      loadBalancer:
        servers:
          - url: http://192.168.1.223:8123
    router:
      loadbalancer:
        servers:
          - url: http://192.168.1.1:80
