log:
  level: INFO

api:
  insecure: false
  dashboard: true

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

providers:
  docker:
    # roles/docker-socket-proxy: read-only API instead of the raw socket.
    endpoint: "tcp://socket-proxy:2375"
    exposedByDefault: false
    # homepage and dozzle sit on socket_proxy too; route over docker_net.
    network: docker_net

  file:
    filename: /dynamic.yml

certificatesResolvers:
  letsencrypt:
    acme:
      email: "oleg.smedyuk@gmail.com"
      storage: "/letsencrypt/acme.json"
      dnsChallenge:
        provider: hetzner
        delayBeforeCheck: "0"

accessLog:
  filePath: "/var/log/traefik/access.log"
  bufferingSize: 100
  filters:
    retryAttempts: true
    statusCodes: "400-499,500-599"
