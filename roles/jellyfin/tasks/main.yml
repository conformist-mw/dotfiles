---
- name: Get render group info
  ansible.builtin.getent:
    database: group
    key: render

- name: Set render group facts
  ansible.builtin.set_fact:
    gid_render: "{{ getent_group['render'][1] }}"

- name: Get video group info
  ansible.builtin.getent:
    database: group
    key: video

- name: Set video group facts
  ansible.builtin.set_fact:
    gid_video: "{{ getent_group['video'][1] }}"

# jellyfin's image declares VOLUME /cache and this role mounted nothing there, so
# docker created a fresh anonymous volume on every container recreate and orphaned
# the previous one — 177 had piled up, the largest 1.1G. Owned by 1000:1000 because
# the container runs as that user; left to docker this would be created root-owned
# and jellyfin could not write it.
- name: Ensure jellyfin cache directory exists
  ansible.builtin.file:
    path: "{{ data_dir }}/jellyfin/cache"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"

- name: Jellyfin container
  community.docker.docker_container:
    image: jellyfin/jellyfin:10.11.11
    name: jellyfin
    restart_policy: "unless-stopped"
    restart: true
    networks:
      - name: "{{ docker_network }}"
    ports:
      - "8096:8096"
    volumes:
      - "{{ data_dir }}/jellyfin/config:/config"
      # Nests under the tmpfs on /cache/transcodes below — docker mounts by path
      # depth, so the bind lands first and the tmpfs on top of it.
      - "{{ data_dir }}/jellyfin/cache:/cache"
      - "/mnt/hdd:/media"
    user: "1000:1000"
    groups:
      - "{{ gid_render }}"
      - "{{ gid_video }}"
    devices:
      - "/dev/dri/renderD128:/dev/dri/renderD128"
    env:
      LIBVA_DRIVER_NAME: "iHD"
      QSV_DEVICE: "/dev/dri/renderD128"
    shm_size: "2g"
    # 4g is only enough while jellyfin's own two brakes are on, and both ship
    # off. Playback settings, not container settings, so they live in
    # config/encoding.xml where jellyfin owns them — named here because the
    # size below is what makes them load-bearing:
    #
    #   EnableThrottling       ffmpeg otherwise runs flat out (speed=31.8x was
    #                          measured), so a whole episode lands in RAM
    #                          within two minutes of pressing play.
    #   EnableSegmentDeletion  otherwise nothing is dropped as playback moves
    #                          on; every segment stays for the whole session.
    #
    # With both off, one 1h episode wrote 3.95G of HLS segments into these 4g
    # and the next thing to play got the 359M that were left: five seconds,
    # then a stall. It reads as a jellyfin glitch cured by a restart, because
    # this mount is recreated empty with the container.
    tmpfs:
      - "/cache/transcodes:size=4g,mode=1777"
