- name: Ensure data directory exists
  ansible.builtin.file:
    path: "{{ app_data_dir }}"
    state: directory

- name: Install glances from pip
  ansible.builtin.pip:
    name: "glances[all]"
    state: present
    virtualenv: "{{ app_data_dir }}/.venv"

- name: Copy glances systemd service
  ansible.builtin.template:
    src: glances.service
    dest: /etc/systemd/system/glances.service
  become: true
  register: glances_unit

# state: started on an already-running unit is a no-op, so an edited ExecStart
# used to land on disk and never reach the process — the unit said one thing
# and the running glances another until something else restarted it.
- name: Enable glances
  ansible.builtin.systemd:
    name: glances.service
    enabled: yes
    state: "{{ 'restarted' if glances_unit.changed else 'started' }}"
    daemon_reload: yes
  become: true

- name: Expose glances to the container network (127.0.0.1 → docker net)
  ansible.builtin.include_role:
    name: expose_local_port
  vars:
    expose_name: "{{ app_name }}"
    expose_ports: ["{{ app_port }}"]
