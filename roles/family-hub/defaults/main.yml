---
family_hub_image: "olegsmedyuk/family-hub:latest"
# Must agree with the -db flag in the image's CMD. When they disagree SQLite
# creates an empty database at the new path and the app comes up healthy and
# blank, so a change here is verified by row counts, not by the log.
family_hub_dir: "{{ data_dir }}/family-hub"

# Where the pre-migration snapshot lands. The nightly backup role mirrors this
# whole directory offsite, so writing here is what gets the snapshot to
# Backblaze — on the next nightly run, not immediately. Falls back to the same
# path the backup role defaults to, so the two agree on a host that has it and
# this still works on one that does not.
family_hub_backup_dir: "{{ vps_backup_dir | default(data_dir + '/backups') }}"

# How many pre-migration snapshots to keep. These accumulate per deploy, not
# per day; the nightly snapshots are the history. What is wanted here is the
# state immediately before the last few schema changes.
family_hub_premigrate_keep: 5

# The bot the token in family_hub_bot_token belongs to. Not a secret and not
# read by the container — it is here so the deployment says which Telegram
# identity it drives, and so a deep link into the Mini App has a source.
family_hub_bot_username: "family_core_hub_bot"

# The one host the app answers on. The transitional lessons.* alias is gone —
# HA, the homepage tile and the Telegram webhook all moved here first.
family_hub_host: "family.{{ ansible_host }}"
family_hub_webhook_host: "{{ family_hub_host }}"

family_hub_gemini_model: "gemini-flash-lite-latest"

# ── Cooking log ──────────────────────────────────────────────────────────────
# Where the bot writes down what was cooked. The API address is the container
# name on the shared docker network: both containers sit on it, so the bot's
# half-dozen calls per photo skip traefik entirely — no TLS, no rate limit, and
# nothing for CrowdSec to read. The public one exists only to link a recorded
# meal back to its recipe from a Telegram message.
family_hub_mealie_url: "http://mealie:9000"
family_hub_mealie_public_url: "https://mealie.{{ ansible_host }}"

# The model that looks at the photograph, OpenAI chat-completions protocol.
# Measured against fourteen dishes before choosing: the cheap Gemini tier read
# a plate of deruny with eggs and salad as "англійський сніданок" three times
# out of three — it is not that it cannot see, it answers with the whole plate
# instead of the main dish. gpt-5.6-luna and gemini-flash-latest both get it
# right. Gemini speaks this protocol too, so switching is these two values:
#   family_hub_ai_base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
#   family_hub_ai_model: "gemini-flash-latest"
family_hub_ai_base_url: "https://api.openai.com/v1"
family_hub_ai_model: "gpt-5.6-luna"

# ── Meal plan ────────────────────────────────────────────────────────────────
# When the empty slots of the coming week get filled. 05:30 because Home
# Assistant sends tomorrow's menu at 07:00 and a plan written after that is a
# plan nobody was told about. Empty disables the filling entirely.
family_hub_mealplan_fill_time: "05:30"

# Two meals a day, no breakfast — the household eats омлет at lunch. The
# `side` entry type stays out on purpose: Mealie hangs a side off the day and
# not off a meal, so it cannot say whether it belongs to lunch or dinner.
family_hub_mealplan_slots: "lunch,dinner"

# How far ahead to keep filled, and how long a dish rests before it may be
# planned again. The rest window is applied by narrowing the household's own
# rule with a lastMade clause computed at each pass: Mealie's filter language
# takes only literal dates, so a window stored in the rule itself would rot
# the day after it was written.
family_hub_mealplan_horizon_days: "7"
family_hub_mealplan_rest_days: "14"

# When the bot lists the recurring chores nobody closed today. Evening, because
# the message means "you forgot" — Home Assistant already says what is due each
# morning. Empty disables the message but not the record.
family_hub_reminder_nag_time: "20:00"

# Minutes after a lesson before the bot asks the group whether it happened.
family_hub_reminder_delay_min: "60"

# Minutes after an appointment starts before the bot asks in the family group
# what it cost; the answer is a reply to that message. "-1" disables it.
family_hub_cost_prompt_min: "60"

# Who the family is, by Telegram user id. Deliberately empty here for the same
# reason as the roster below: this repo is public and those are real names
# against real ids. Set family_hub_people in host_vars/hetzner/secrets.sops.yaml.
family_hub_people: ""

# Optional roster used to normalize the "who" of a captured appointment.
# Deliberately empty here — this repo is public and those are family names.
# Set family_hub_visit_people in host_vars/hetzner/secrets.sops.yaml to fill it.
family_hub_visit_people: ""

# ── School-today timetable mirror ────────────────────────────────────────────
# The child's academic school day, pulled from the school-today.com parent
# portal and served as a SECOND ICS feed (/school.ics) for its own HA Remote
# Calendar — separate from /calendar.ics, which is the family's own courses and
# appointments. The sync is off until the login secrets below are set in
# host_vars/hetzner (email, password, pupil id); these are the non-secret knobs.
family_hub_school_today_base_url: "https://school-today.com"
# Weeks of timetable mirrored from the current week forward.
family_hub_school_today_weeks_ahead: "3"
# How often the container re-logs in and refreshes the cache (Go duration).
family_hub_school_sync_interval: "12h"
# Which portal categories reach /school.ics: lesson,meal,daycare,routine.
# Lessons only keeps meals, recess and after-school care out of the feed the
# evening "tomorrow's lessons" digest reads.
family_hub_school_ics_include: "lesson"
# When the bot posts tomorrow's school timetable. The old HA automation fired
# at 19:30; keeping the time means the message just gets more complete.
family_hub_school_digest_time: "19:30"
# The Friday review of the school week just gone: per subject, topics, the
# teacher's notes, homework and marks. Unlike the digest above it reads the
# portal's lesson pages directly, so it is off without the SCHOOL_TODAY_*
# credentials no matter what these say. 0=Sun..6=Sat; unset disables.
# 19:45 rather than 19:30 so the two school messages do not arrive together.
family_hub_school_week_review_dow: "5"
family_hub_school_week_review_time: "19:45"
