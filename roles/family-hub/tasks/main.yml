---
# family-hub is the merged lessons + family-visits app: one container, one bot,
# one SQLite file, one ICS feed.
#
# Every secret it reads is a family_hub_* key in host_vars/hetzner —
# secrets belong to a host, not to a role, so there is no vars/ file here to
# load. Names with no default are required: a typo should fail the play rather
# than quietly start a bot with an empty token.
- name: Ensure family-hub data directory
  ansible.builtin.file:
    path: "{{ family_hub_dir }}"
    state: directory
    mode: "0755"

# No automatic seeding: the image bundles no Excel file (it holds personal
# data). A fresh install starts empty; see DEPLOY.md in the family-hub repo for
# the one-off manual import command.

# Migrate as its own step, before the container is touched. The server also
# migrates on boot, but a failure there happens inside a container this play
# has already created: docker reports it started, the play goes green, and the
# app restarts forever. Here a failure stops the play with the old container
# still serving. This also pulls the new image, so the container task below
# never races a pull.
- name: Migrate the family-hub database
  community.docker.docker_container:
    name: family-hub-migrate
    image: "{{ family_hub_image }}"
    pull: true
    entrypoint: /app/migrate
    command: ["-db", "/data/family-hub.db"]
    user: "{{ puid }}:{{ pgid }}"
    volumes:
      - "{{ family_hub_dir }}:/data"
    detach: false
    cleanup: true
    restart_policy: "no"
    output_logs: true
  register: family_hub_migrate
  # The module reports a finished container, not a successful one — a migration
  # that exits 1 is "changed" unless the exit code is checked by hand. It lives
  # in `status`, not in container.State: cleanup removes the container before
  # the module can inspect it.
  failed_when: (family_hub_migrate.status | default(1)) != 0

- name: Report the schema version
  ansible.builtin.debug:
    msg: "{{ family_hub_migrate.container.Output | default('') | trim | split('\n') | last }}"

- name: Family-hub container
  # Diff off: this task's before/after is the container spec, and the container
  # spec is every secret the app has — bot token, webhook secret, ICS token,
  # Gemini key. A run that changes any env var would print all of them to the
  # terminal and into whatever captured that terminal.
  diff: false
  community.docker.docker_container:
    image: "{{ family_hub_image }}"
    pull: true
    name: family-hub
    restart: true
    restart_policy: "unless-stopped"
    user: "{{ puid }}:{{ pgid }}"
    networks:
      - name: "{{ docker_network }}"
    env:
      TZ: "{{ tz }}"
      TELEGRAM_BOT_TOKEN: "{{ family_hub_bot_token }}"
      TELEGRAM_WEBHOOK_URL: "https://{{ family_hub_webhook_host }}{{ family_hub_webhook_path }}"
      TELEGRAM_WEBHOOK_SECRET: "{{ family_hub_webhook_secret }}"
      TELEGRAM_ALLOWED_CHATS: "{{ family_hub_allowed_chats }}"
      # Who may open the Mini App. Deliberately NOT the chat allowlist above:
      # a Mini App authenticates the person who tapped it, so its initData
      # carries a user id even when it was launched from the family group.
      # Empty means nobody, which is the safe direction to fail.
      TELEGRAM_MINI_USERS: "{{ family_hub_mini_users }}"
      TELEGRAM_NOTIFY_CHAT: "{{ family_hub_notify_chat }}"
      TELEGRAM_REMINDER_DELAY_MIN: "{{ family_hub_reminder_delay_min }}"
      # Free-text appointment capture. Without the key the bot still serves
      # everything except capture.
      GEMINI_API_KEY: "{{ family_hub_gemini_api_key }}"
      GEMINI_MODEL: "{{ family_hub_gemini_model }}"
      VISIT_PEOPLE: "{{ family_hub_visit_people }}"
      APPOINTMENT_COST_PROMPT_MIN: "{{ family_hub_cost_prompt_min }}"
      # NOTIFICATIONS_ENABLED is deliberately unset: Home Assistant sends the
      # daily/weekly appointment summaries from the ICS feed below, so enabling
      # them here would double-post to the family group. Lesson reminders are a
      # separate ticker and are unaffected.
      #
      # The recurring-chore nag is NOT behind that flag and needs its own time.
      # HA cannot send this one: it reads a calendar and knows nothing about
      # what was closed. Empty disables the message; the record of what came
      # due is written regardless, by a ticker that takes no configuration.
      REMINDER_NAG_TIME: "{{ family_hub_reminder_nag_time }}"
      ICS_TOKEN: "{{ family_hub_ics_token }}"
    volumes:
      - "{{ family_hub_dir }}:/data"
    labels:
      traefik.enable: "true"
      traefik.http.routers.family-hub.entrypoints: "websecure"
      traefik.http.routers.family-hub.tls: "true"
      traefik.http.routers.family-hub.tls.certresolver: "letsencrypt"
      traefik.http.routers.family-hub.rule: "Host(`{{ family_hub_host }}`)"
      traefik.http.services.family-hub.loadbalancer.server.port: "8080"
      traefik.http.routers.family-hub.middlewares: "auth-chain@file"
      # Telegram webhook endpoint must bypass oauth so Telegram can POST to it.
      # The path itself is a secret (lives in SOPS), so the endpoint is not
      # discoverable from the public repo.
      #
      # If a second host is ever added back here, the alternation must be
      # parenthesized: `||` binds looser than `&&` in Traefik rules, so
      # `Host(a) || Host(b) && PathPrefix(p)` matches ALL of host a and would
      # serve the whole app with no auth.
      traefik.http.routers.family-hub-bot.entrypoints: "websecure"
      traefik.http.routers.family-hub-bot.tls: "true"
      traefik.http.routers.family-hub-bot.tls.certresolver: "letsencrypt"
      traefik.http.routers.family-hub-bot.rule: "Host(`{{ family_hub_host }}`) && PathPrefix(`{{ family_hub_webhook_path }}`)"
      traefik.http.routers.family-hub-bot.middlewares: "no-auth-chain@file"
      traefik.http.routers.family-hub-bot.service: "family-hub"
      traefik.http.routers.family-hub-bot.priority: "100"
      # Telegram Mini App. Bypasses oauth because Telegram's web view cannot
      # carry an oauth2-proxy session; it is guarded instead by an HMAC over
      # the launch payload plus TELEGRAM_MINI_USERS above. /mini itself is a
      # data-free shell, and everything under /mini/api/ verifies per request.
      #
      # The bypass covers only this prefix — the dashboard, payments and
      # courses stay behind auth-chain. The priority matters: without it the
      # catch-all Host() router wins and the Mini App hits the oauth wall.
      traefik.http.routers.family-hub-mini.entrypoints: "websecure"
      traefik.http.routers.family-hub-mini.tls: "true"
      traefik.http.routers.family-hub-mini.tls.certresolver: "letsencrypt"
      traefik.http.routers.family-hub-mini.rule: "Host(`{{ family_hub_host }}`) && PathPrefix(`/mini`)"
      traefik.http.routers.family-hub-mini.middlewares: "no-auth-chain@file"
      traefik.http.routers.family-hub-mini.service: "family-hub"
      traefik.http.routers.family-hub-mini.priority: "100"
      # ICS feed for HA's Remote Calendar — machine-to-machine, so it bypasses
      # auth and is guarded by the ICS_TOKEN query param instead.
      traefik.http.routers.family-hub-ics.entrypoints: "websecure"
      traefik.http.routers.family-hub-ics.tls: "true"
      traefik.http.routers.family-hub-ics.tls.certresolver: "letsencrypt"
      traefik.http.routers.family-hub-ics.rule: "Host(`{{ family_hub_host }}`) && PathPrefix(`/calendar.ics`)"
      traefik.http.routers.family-hub-ics.middlewares: "no-auth-chain@file"
      traefik.http.routers.family-hub-ics.service: "family-hub"
      traefik.http.routers.family-hub-ics.priority: "100"
