---
# Codifies the previously-manual native CrowdSec install on the VPS:
# detection agent + iptables firewall-bouncer (bans are enforced at the
# network level — a banned IP is dropped before it reaches Traefik).
#
# The functional fix vs the old wizard setup: acquire Traefik's access log
# (+ the crowdsecurity/traefik parser) so HTTP attacks are actually detected.
# Before this, only SSH was watched; apache2/nginx acquisitions were dead.

- name: Ensure apt keyrings dir
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  become: true

- name: Add CrowdSec apt signing key
  ansible.builtin.apt_key:
    url: https://packagecloud.io/crowdsec/crowdsec/gpgkey
    keyring: /etc/apt/keyrings/crowdsec_crowdsec-archive-keyring.gpg
    state: present
  become: true

- name: Remove stale .asc keyring from the earlier failed run
  ansible.builtin.file:
    path: /etc/apt/keyrings/crowdsec_crowdsec-archive-keyring.asc
    state: absent
  become: true

- name: Add CrowdSec apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/crowdsec_crowdsec.list
    content: "deb [signed-by=/etc/apt/keyrings/crowdsec_crowdsec-archive-keyring.gpg] https://packagecloud.io/crowdsec/crowdsec/any any main\n"
    mode: "0644"
  become: true

- name: Install CrowdSec + iptables firewall bouncer
  ansible.builtin.apt:
    name:
      - crowdsec
      - crowdsec-firewall-bouncer-iptables
    state: present
    update_cache: true
  become: true

- name: Install crowdsecurity/traefik collection
  ansible.builtin.command: cscli collections install crowdsecurity/traefik
  args:
    creates: /etc/crowdsec/collections/traefik.yaml
  become: true
  notify: restart crowdsec

- name: Remove dead collections (no apache2/nginx on this host)
  ansible.builtin.command: "cscli collections remove crowdsecurity/{{ item }}"
  args:
    removes: "/etc/crowdsec/collections/{{ item }}.yaml"
  loop:
    - apache2
    - nginx
  become: true
  notify: restart crowdsec

- name: Acquisition — Traefik access log
  ansible.builtin.template:
    src: acquis-traefik.yaml.j2
    dest: /etc/crowdsec/acquis.d/traefik.yaml
    mode: "0644"
  become: true
  notify: restart crowdsec

- name: Acquisition — sshd (journald)
  ansible.builtin.template:
    src: acquis-sshd.yaml.j2
    dest: /etc/crowdsec/acquis.d/sshd.yaml
    mode: "0644"
  become: true
  notify: restart crowdsec

- name: Neutralise the wizard acquis.yaml (sources now live in acquis.d/)
  ansible.builtin.copy:
    dest: /etc/crowdsec/acquis.yaml
    content: "# Managed by Ansible — acquisition sources are in acquis.d/\n"
    mode: "0644"
  become: true
  notify: restart crowdsec

# Home Assistant LL-HLS camera streaming (rotating token paths + benign 400s)
# otherwise self-bans the viewer's IP via http-probing / http-crawl-non_statics.
# See the template header for the full mechanism.
- name: Whitelist — HA LL-HLS camera streaming
  ansible.builtin.template:
    src: ha-hls-whitelist.yaml.j2
    dest: /etc/crowdsec/parsers/s02-enrich/ha-hls-whitelist.yaml
    mode: "0644"
  become: true
  notify: restart crowdsec

# The homepage dashboard self-bans the viewer whenever every container goes down
# at once (a dockerd restart): traefik stays up with no routers and 404s each of
# the tile-status polls the open tab keeps making. See the template header.
- name: Whitelist — homepage dashboard polling API
  ansible.builtin.template:
    src: homepage-api-whitelist.yaml.j2
    dest: /etc/crowdsec/parsers/s02-enrich/homepage-api-whitelist.yaml
    mode: "0644"
  become: true
  notify: restart crowdsec

# Progressive ban durations (8h → 16h → 24h …) instead of the stock flat 4h.
# Cuts repeat alerts from persistent scanners so we stay under the CrowdSec
# Console Community alert quota (500/mo); network-level protection is unchanged.
- name: Remediation profiles — progressive ban duration
  ansible.builtin.template:
    src: profiles.yaml.j2
    dest: /etc/crowdsec/profiles.yaml
    mode: "0644"
  become: true
  notify: restart crowdsec

# Docker recreates DOCKER-USER empty on every daemon start, taking the bouncer's
# jump with it — bans would silently stop being enforced on the web path again,
# which is the exact failure this whole change is fixing. Same shape as the
# expose_local_port units: something that re-asserts itself after docker.
# --no-block, because a blocking systemctl call inside ExecStartPost deadlocks
# against the job systemd is already running.
- name: Ensure the docker unit drop-in dir exists
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    mode: "0755"
  become: true

- name: Re-arm the bouncer after a docker restart
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker.service.d/99-crowdsec-bouncer.conf
    mode: "0644"
    content: |
      # Managed by Ansible (roles/crowdsec)
      [Service]
      ExecStartPost=-/usr/bin/systemctl restart --no-block crowdsec-firewall-bouncer.service
  become: true
  notify: reload systemd

# --- allowlist ----------------------------------------------------------------
# Ordered before the bouncer change below on purpose: once bans are enforced on
# the web path, a self-ban costs the dashboards as well as SSH, so the escape
# hatch has to exist first. Empty by default — see crowdsec_allowlist_ips.
- name: Ensure the local allowlist exists
  ansible.builtin.command: >-
    cscli allowlists create {{ crowdsec_allowlist_name }}
    -d "Never ban these — managed by ansible (roles/crowdsec)"
  register: crowdsec_allowlist_create
  changed_when: "'created successfully' in crowdsec_allowlist_create.stdout"
  failed_when:
    - crowdsec_allowlist_create.rc != 0
    - "'already exists' not in crowdsec_allowlist_create.stderr + crowdsec_allowlist_create.stdout"
  become: true

- name: Add our own sources to the allowlist
  ansible.builtin.command: >-
    cscli allowlists add {{ crowdsec_allowlist_name }} {{ item }}
    -d "ansible: roles/crowdsec defaults"
  register: crowdsec_allowlist_add
  changed_when: "'added to allowlist' in crowdsec_allowlist_add.stdout"
  failed_when:
    - crowdsec_allowlist_add.rc != 0
    - "'already' not in crowdsec_allowlist_add.stderr + crowdsec_allowlist_add.stdout"
  loop: "{{ crowdsec_allowlist_ips }}"
  become: true

# --- firewall bouncer ---------------------------------------------------------
# The bouncer config is generated by the package with an api_key in it, so this
# edits the one setting that is wrong instead of templating the whole file and
# taking ownership of a secret. The regex replaces whatever list is there, so
# the var stays the desired state rather than an append.
- name: Bouncer — enforce bans on the docker path as well as INPUT
  ansible.builtin.replace:
    path: /etc/crowdsec/bouncers/crowdsec-firewall-bouncer.yaml
    regexp: '^iptables_chains:\n(?:[ \t]+-[ \t]+\S+\n)+'
    replace: |
      iptables_chains:
      {% for chain in crowdsec_bouncer_chains %}
        - {{ chain }}
      {% endfor %}
  become: true
  notify: restart crowdsec-firewall-bouncer

# Optional: keep the same identity in the CrowdSec Console (app.crowdsec.net)
# across rebuilds by restoring the CAPI credentials. Skipped unless the secret
# is set in host_vars/hetzner (crowdsec_capi_login / crowdsec_capi_password).
- name: Restore online (CAPI / console) credentials
  ansible.builtin.copy:
    dest: /etc/crowdsec/online_api_credentials.yaml
    content: |
      url: {{ crowdsec_capi_url | default('https://api.crowdsec.net/') }}
      login: {{ crowdsec_capi_login }}
      password: {{ crowdsec_capi_password }}
    mode: "0600"
  become: true
  when: crowdsec_capi_password is defined
  notify: restart crowdsec

# --- Stable local-agent identity ---------------------------------------------
# The Debian package auto-registers the local agent under a random hash
# (e.g. ba492…) and mints a fresh one on every host rebuild, leaving the old
# entries as stale machines. Register the agent under a stable name and own its
# credentials file so `cscli machines list` stays clean across rebuilds. This
# also repairs the file if another role clobbered it (the crowdsec-web-ui role
# historically wrote its watcher creds here — now fixed with `--file /dev/null`).
- name: List registered LAPI machines
  ansible.builtin.command: cscli machines list -o json
  register: crowdsec_machines
  changed_when: false
  become: true

- name: Register the local agent under a stable name
  ansible.builtin.command: >-
    cscli machines add {{ crowdsec_agent_machine }} --auto --force
    --file /etc/crowdsec/local_api_credentials.yaml
  register: crowdsec_agent_register
  when: crowdsec_agent_machine not in (crowdsec_machines.stdout | from_json | map(attribute='machineId') | list)
  become: true

# Adopt the new credentials immediately, before pruning the old machine, so the
# running agent is never authenticating as an identity we're about to delete.
- name: Restart crowdsec to adopt the stable agent credentials
  ansible.builtin.systemd:
    name: crowdsec
    state: restarted
  when: crowdsec_agent_register is changed
  become: true

# Remove auto-registered local machines (random hashes) that aren't our stable
# name. Scoped to loopback so remote watchers (e.g. the web UI container on the
# docker bridge) are never touched. Safe: the agent now runs as the stable name.
- name: Prune stale auto-registered local machines
  ansible.builtin.command: cscli machines delete {{ item.machineId }}
  loop: "{{ crowdsec_machines.stdout | from_json }}"
  loop_control:
    label: "{{ item.machineId }}"
  when:
    - item.ipAddress in ['127.0.0.1', '::1']
    - item.machineId != crowdsec_agent_machine
  become: true
