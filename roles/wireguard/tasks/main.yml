---
- name: Install wireguard tools
  ansible.builtin.apt:
    name:
      - wireguard
      - qrencode # used by the local onboard-client.sh helper
    state: present
    update_cache: true
  become: true

- name: Enable IPv4 forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_set: true
    state: present
    reload: true
  become: true

# route_localnet (needed for the DNS -> 127.0.0.1 DNAT) is set per-interface
# inside the firewall script at PostUp time — the interface does not exist yet
# at this point on a fresh host, so it cannot be set here.

- name: Render per-interface firewall scripts
  ansible.builtin.template:
    src: wg-firewall.sh.j2
    dest: "/etc/wireguard/wg-firewall-{{ item.key }}.sh"
    owner: root
    group: root
    mode: "0700"
  loop: "{{ wg_interfaces | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  vars:
    iface_name: "{{ item.key }}"
    iface: "{{ item.value }}"
    ext_if: "{{ ansible_default_ipv4.interface }}"
  notify: restart wireguard
  become: true

- name: Remove legacy (pre-refactor) firewall scripts
  ansible.builtin.file:
    path: "/etc/wireguard/{{ item }}"
    state: absent
  loop:
    - post-up.sh
    - post-down.sh
  become: true

- name: Render interface configs
  diff: false
  ansible.builtin.template:
    src: wg.conf.j2
    dest: "/etc/wireguard/{{ item.key }}.conf"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ wg_interfaces | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  vars:
    iface_name: "{{ item.key }}"
    iface: "{{ item.value }}"
  notify: restart wireguard
  become: true

- name: Enable and start interfaces
  ansible.builtin.systemd:
    name: "wg-quick@{{ item.key }}"
    enabled: true
    state: started
  loop: "{{ wg_interfaces | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  become: true

# Only where the host also runs docker: the guard lives in DOCKER-USER.
- name: Guard forwarding into the tunnels
  when: wg_docker_lan_allow is defined
  block:
    - name: Render the forward guard script
      ansible.builtin.template:
        src: wg-forward-guard.sh.j2
        dest: /usr/local/sbin/wg-forward-guard.sh
        owner: root
        group: root
        mode: "0700"
      register: wg_guard_script

    - name: Install the forward guard unit
      ansible.builtin.template:
        src: wg-forward-guard.service.j2
        dest: /etc/systemd/system/wg-forward-guard.service
        mode: "0644"
      register: wg_guard_unit

    # Starting (restarting on change) the oneshot applies the rules now, so the
    # unit is the one source of truth for boot and for this run alike.
    - name: Enable and apply the forward guard
      ansible.builtin.systemd:
        name: wg-forward-guard.service
        enabled: true
        state: "{{ 'restarted' if (wg_guard_script.changed or wg_guard_unit.changed) else 'started' }}"
        daemon_reload: true
  become: true

# Who connects through the listed interfaces, and when (see the script).
- name: Log peer activity
  when: wg_peer_log is defined
  vars:
    wg_peer_log_interval: 300
    wg_peer_log_file: /var/log/wg-peer-log.log
  block:
    - name: Render the peer log script
      ansible.builtin.template:
        src: wg-peer-log.sh.j2
        dest: /usr/local/sbin/wg-peer-log.sh
        owner: root
        group: root
        mode: "0700"

    - name: Install the peer log service
      ansible.builtin.copy:
        dest: /etc/systemd/system/wg-peer-log.service
        mode: "0644"
        content: |
          [Unit]
          Description=Log active WireGuard peers

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/wg-peer-log.sh

    - name: Install the peer log timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/wg-peer-log.timer
        mode: "0644"
        content: |
          [Unit]
          Description=Log active WireGuard peers every {{ wg_peer_log_interval }}s

          [Timer]
          OnBootSec={{ wg_peer_log_interval }}
          OnUnitActiveSec={{ wg_peer_log_interval }}
          AccuracySec=1s

          [Install]
          WantedBy=timers.target

    - name: Enable the peer log timer
      ansible.builtin.systemd:
        name: wg-peer-log.timer
        enabled: true
        state: started
        daemon_reload: true
  become: true

- name: Remove the peer log when no interface is listed
  when: wg_peer_log is not defined
  block:
    - name: Stop the peer log timer
      ansible.builtin.systemd:
        name: wg-peer-log.timer
        enabled: false
        state: stopped
      failed_when: false

    - name: Delete the peer log files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/wg-peer-log.timer
        - /etc/systemd/system/wg-peer-log.service
        - /usr/local/sbin/wg-peer-log.sh
        - /var/log/wg-peer-log.log
  become: true
