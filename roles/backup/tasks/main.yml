- name: Ensure rclone dir exists
  ansible.builtin.file:
    dest: ~/.config/rclone
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0700"
- name: Copy rclone backblaze config
  ansible.builtin.copy:
    dest: ~/.config/rclone/rclone.conf
    content: |
      [backblaze]
      type = b2
      account = {{ b2_account_id }}
      key = {{ b2_application_key }}

      [keenetic]
      type = smb
      host = 192.168.1.1

    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"

- name: Ensure Immich DB backup dir exists
  ansible.builtin.file:
    dest: "{{ db_backup_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0750"

# One unit per job. The DB dump and each of its two offsite copies are separate units on
# purpose: a dead destination (the keenetic share vanishes whenever the router's USB disk
# unmounts) must not stop the other copy, and each failure alerts under its own name.
- name: Build the list of backup jobs
  ansible.builtin.set_fact:
    backup_jobs: "{{ ['backblaze', 'keenetic', 'db'] + (['db_backblaze', 'db_keenetic'] if db_backup_offsite | bool else []) }}"

- name: Copy backup scripts
  ansible.builtin.template:
    src: "{{ item }}_backup.sh.j2"
    dest: "/usr/local/bin/{{ item }}_backup.sh"
    owner: root
    group: root
    mode: "0755"
  loop: "{{ backup_jobs }}"
  become: true

- name: Copy systemd service
  ansible.builtin.template:
    src: "{{ item }}_backup.service"
    dest: "/etc/systemd/system/{{ item }}_backup.service"
  loop: "{{ backup_jobs }}"
  become: true

- name: Copy systemd timer
  ansible.builtin.copy:
    src: "{{ item }}_backup.timer"
    dest: "/etc/systemd/system/{{ item }}_backup.timer"
  loop: "{{ backup_jobs }}"
  become: true

- name: enable backup timer
  ansible.builtin.systemd:
    name: "{{ item }}_backup.timer"
    enabled: yes
    state: started
    daemon_reload: yes
  loop: "{{ backup_jobs }}"
  become: true

