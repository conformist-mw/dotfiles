---
# VPS-specific packages (not in common)
- name: Install vps-specific packages
  ansible.builtin.apt:
    name:
      - python3-passlib
      - python3-venv
    update_cache: yes
  become: true

- name: Provide swap
  block:
    # fallocate, not dd: the file only has to exist at the right size, and a
    # hole-punched file is what mkswap wants anyway. Guarded on the file rather
    # than made idempotent by mkswap — re-running mkswap on a swapfile that is
    # currently in use corrupts it.
    - name: Check whether the swap file exists
      ansible.builtin.stat:
        path: "{{ vps_swap_path }}"
      register: vps_swapfile

    - name: Allocate the swap file
      ansible.builtin.command: "fallocate -l {{ vps_swap_size_mb }}M {{ vps_swap_path }}"
      when: not vps_swapfile.stat.exists

    # 0600 before mkswap, or the kernel refuses it as insecure.
    - name: Restrict the swap file
      ansible.builtin.file:
        path: "{{ vps_swap_path }}"
        owner: root
        group: root
        mode: "0600"

    - name: Format the swap file
      ansible.builtin.command: "mkswap {{ vps_swap_path }}"
      when: not vps_swapfile.stat.exists

    # fstab first, then swapon: an entry that survives a reboot is the point,
    # and enabling it without the entry produces swap that quietly disappears
    # the next time the host restarts.
    - name: Record the swap file in fstab
      ansible.posix.mount:
        path: none
        src: "{{ vps_swap_path }}"
        fstype: swap
        opts: sw
        state: present

    - name: Enable the swap file
      ansible.builtin.command: "swapon {{ vps_swap_path }}"
      register: vps_swapon
      changed_when: vps_swapon.rc == 0
      failed_when: vps_swapon.rc != 0 and 'already active' not in vps_swapon.stderr

    - name: Set swappiness
      ansible.posix.sysctl:
        name: vm.swappiness
        value: "{{ vps_swappiness }}"
        sysctl_file: /etc/sysctl.d/99-homelab-swap.conf
        reload: true
  become: true

- name: Create server dir
  ansible.builtin.file:
    path: "{{ server_dir }}"
    state: directory

# Extra human logins (e.g. egor for the school-bot). Defined in
# host_vars/hetzner/users.yml. Deploy still runs as vps_user; these users get
# SSH access + docker group so they can manage their own containers.
- name: Create human user groups
  ansible.builtin.group:
    name: "{{ item.name }}"
    gid: "{{ item.gid }}"
    state: present
  loop: "{{ vps_users | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  become: true

- name: Create human users
  ansible.builtin.user:
    name: "{{ item.name }}"
    uid: "{{ item.uid }}"
    group: "{{ item.name }}"
    groups: "{{ item.groups | default([]) }}"
    # Desired state, not additive: with append the docker group could be listed
    # here, removed, and stay on the account forever, because ansible would
    # only ever add. The primary group is untouched either way.
    append: false
    shell: "{{ item.shell | default('/bin/bash') }}"
    create_home: true
  loop: "{{ vps_users | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  become: true

- name: Install authorized SSH keys for human users
  ansible.posix.authorized_key:
    user: "{{ item.name }}"
    key: "{{ item.ssh_key }}"
    state: present
  loop: "{{ vps_users | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  become: true

- name: Ensure per-user data dirs (apps lay out subdirs under these)
  ansible.builtin.file:
    path: "{{ item.data_dir }}"
    state: directory
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "0755"
  loop: "{{ vps_users | default([]) | selectattr('data_dir', 'defined') | list }}"
  loop_control:
    label: "{{ item.name }}"
  become: true

# --- container operations without the docker group ------------------------------
# Being in `docker` is being root: the socket will start a container that binds
# / and runs anything. Users who only need to look at their own service's logs
# and bounce it get this wrapper instead, whitelisted in sudoers as one command
# with no argument pattern to slip past.
- name: Install the appctl container wrapper
  ansible.builtin.template:
    src: appctl.j2
    dest: /usr/local/bin/appctl
    owner: root
    group: root
    mode: "0755"
  become: true
  when: vps_users | default([]) | selectattr('apps', 'defined') | list | length > 0

- name: Grant appctl in sudoers
  ansible.builtin.template:
    src: appctl-sudoers.j2
    dest: /etc/sudoers.d/50-appctl
    owner: root
    group: root
    mode: "0440"
    # A malformed sudoers file locks everyone out of sudo, so it is never
    # written unless visudo has already accepted it.
    validate: "visudo -cf %s"
  become: true
  when: vps_users | default([]) | selectattr('apps', 'defined') | list | length > 0

# --- sshd ---------------------------------------------------------------------
# Deliberately after the authorized_key tasks above: this run installs the keys
# and only then takes passwords away, so a new user in vps_users can never be
# locked out by the same play that creates them.
#
# Passwords were on (the image default) with one account carrying a usable one,
# and that account is in the docker group, which is root by another name. The
# journal shows 413 publickey logins and 0 password logins in 30 days, so
# nothing actually used this. Recovery if a key is ever lost is the Hetzner
# web console, which is not sshd and is unaffected by any of it.
#
# A drop-in rather than an edit of sshd_config: the packaged file stays
# untouched and this repo owns one file to read and one file to delete.
- name: Harden sshd
  block:
    - name: Write the sshd hardening drop-in
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/99-hardening.conf
        mode: "0644"
        content: |
          # Managed by Ansible (roles/vps)
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin prohibit-password
          MaxAuthTries 3
      register: sshd_dropin

    # sshd -t parses the whole tree, Include and all. Validating here rather
    # than with copy's `validate` because that hands sshd the drop-in alone,
    # which is not a complete config and tells us nothing.
    - name: Validate the sshd config
      ansible.builtin.command: /usr/sbin/sshd -t
      changed_when: false

    - name: Reload sshd
      ansible.builtin.systemd:
        name: ssh
        state: reloaded
      when: sshd_dropin is changed
  rescue:
    # A bad config must not survive the run: leave the host reachable and fail
    # loudly instead of reloading sshd into something that will not start.
    - name: Remove the drop-in after a failed validation
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d/99-hardening.conf
        state: absent

    - name: Fail with the validation error
      ansible.builtin.fail:
        msg: "sshd -t rejected the hardening drop-in; it has been removed and sshd left untouched."
  become: true

# wg interface sysctls (route_localnet) are owned by the wireguard role now.

- name: Install crowdsec
  block:
    - name: add apt-key
      ansible.builtin.get_url:
        url: https://packagecloud.io/crowdsec/crowdsec/gpgkey
        dest: /etc/apt/keyrings/crowdsec_crowdsec-archive-keyring.gpg

    - name: add crowdsec repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/crowdsec_crowdsec-archive-keyring.gpg] https://packagecloud.io/crowdsec/crowdsec/any any main"
        state: present
        filename: crowdsec_crowdsec

    - name: Install crowdsec
      ansible.builtin.apt:
        name:
          - crowdsec
          - crowdsec-firewall-bouncer-iptables
        update_cache: yes
  become: true
