- name: Include labels generator
  ansible.builtin.include_role:
    name: labels_generator

# The backup target belongs to the backup role, which runs later in the play;
# navidrome writes its first snapshot before that, so create it here too rather
# than leave the container to fail on a missing bind mount.
- name: Ensure the navidrome backup directory exists
  ansible.builtin.file:
    path: "{{ navidrome_backup_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0750"

# Created here so docker does not create it as root on first start.
- name: Ensure the library directories exist
  ansible.builtin.file:
    path: "{{ item.value.host }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0775"
  loop: "{{ nd_libraries | dict2items }}"
  loop_control:
    label: "{{ item.value.host }}"

- name: Navidrome config file
  ansible.builtin.template:
    src: navidrome.toml.j2
    dest: "{{ app_data_dir }}/navidrome.toml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"

- name: Navidrome container
  community.docker.docker_container:
    image: deluan/navidrome:0.64.2
    pull: true
    name: "{{ app_name }}"
    restart: true
    restart_policy: "unless-stopped"
    networks:
      - name: "{{ docker_network }}"
    ports:
      - "4533:4533"
    volumes:
      - "{{ app_data_dir }}:/data"
      - "{{ nd_music_dir }}:/music:ro"
      - "{{ nd_mixes_dir }}:/mixes:ro"
      - "{{ navidrome_backup_dir }}:/backup"
    user: "1000:1000"
    env:
      ND_SCANSCHEDULE: "1h"
      ND_LOGLEVEL: "info"
      ND_SESSIONTIMEOUT: "24h"
      ND_BASEURL: "http://navidrome.{{ ansible_host }}"
      ND_ENABLESHARING: "true"
      # See the backup notes in defaults/main.yml. The path is the bind mount
      # above, not a directory inside /data: the point is to land in the tree
      # the offsite jobs already mirror.
      ND_BACKUP_PATH: "/backup"
      ND_BACKUP_SCHEDULE: "{{ navidrome_backup_schedule }}"
      ND_BACKUP_COUNT: "{{ navidrome_backup_count }}"
      ND_CONFIGFILE: "/data/navidrome.toml"
    labels: "{{ labels }}"

# navidrome only creates the library for its music folder; the rest exist only
# in its database and are added through the native API, which is what the
# Settings → Libraries page calls.
- name: Create the extra navidrome libraries
  block:
    - name: Log in to the navidrome API
      ansible.builtin.uri:
        url: "http://localhost:4533/auth/login"
        method: POST
        body_format: json
        body:
          username: "{{ navidrome_admin_user }}"
          password: "{{ navidrome_admin_password }}"
      register: nd_login
      # The container was just (re)started.
      retries: 30
      delay: 2
      until: nd_login.status == 200
      no_log: true
      # Read-only, and the two tasks after it need the token even in --check.
      check_mode: false

    - name: List the navidrome libraries
      ansible.builtin.uri:
        url: "http://localhost:4533/api/library"
        headers:
          x-nd-authorization: "Bearer {{ nd_login.json.token }}"
      register: nd_existing_libraries
      check_mode: false

    - name: Add the missing libraries
      ansible.builtin.uri:
        url: "http://localhost:4533/api/library"
        method: POST
        body_format: json
        headers:
          x-nd-authorization: "Bearer {{ nd_login.json.token }}"
        body:
          name: "{{ item.value.name }}"
          path: "{{ item.key }}"
        status_code: [200, 201]
      changed_when: true
      loop: >-
        {{ nd_libraries | dict2items
           | rejectattr('key', 'in', nd_existing_libraries.json | map(attribute='path') | list)
           | list }}
      loop_control:
        label: "{{ item.key }}"

# The smart playlists live in the repo; navidrome imports .nsp files it finds
# in the library and re-reads them when they change.
- name: Install the smart playlists
  ansible.builtin.copy:
    src: playlists/
    dest: "{{ nd_music_dir }}/"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"

# ── Reaper ───────────────────────────────────────────────────────────────────
# Replaces two separate jobs: the hourly nd_autoremove timer that deleted
# starred files, and the nd_remove_missing timer that purged the rows they left
# behind. One daemon now does both, in order, within seconds.
#
# Why the old pair went: nd_autoremove never cleared the marker it acted on, so
# every hour it re-read rows whose files it had already deleted and logged
# "File not found" again. That is 49605 of the 54477 lines in its log against
# 2172 real deletions. And because the purge lived in a different timer on a
# different schedule, a deleted track stayed visible in the UI for up to two
# hours.
- name: Remove the superseded autoremove and remove-missing jobs
  block:
    - name: Stop and disable the old units
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
      failed_when: false
      loop:
        - nd_autoremove.timer
        - nd_autoremove.service
        - nd_remove_missing.timer
        - nd_remove_missing.service

    - name: Delete the old unit and script files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/nd_autoremove.timer
        - /etc/systemd/system/nd_autoremove.service
        - /etc/systemd/system/nd_remove_missing.timer
        - /etc/systemd/system/nd_remove_missing.service
        - /usr/local/bin/nd_autoremove_starred.sh
        - "{{ app_data_dir }}/nd_remove_missing.py"
        - "{{ app_data_dir }}/autoremove.log"
  become: true

- name: Setup the reaper
  block:
    - name: Create the navidrome credentials environment file
      ansible.builtin.copy:
        dest: "{{ nd_env_filepath }}"
        content: |
          ND_USERNAME={{ navidrome_admin_user }}
          ND_PASSWORD={{ navidrome_admin_password }}
          ND_BASE_URL=http://{{ app_name }}.{{ ansible_host }}
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"
      become: true

    - name: Install httpx into the navidrome venv
      ansible.builtin.pip:
        name: "httpx"
        state: present
        virtualenv: "{{ app_data_dir }}/.venv"

    - name: Copy the reaper script
      ansible.builtin.template:
        src: nd_reaper.py
        dest: "{{ nd_reaper_path }}"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"
      vars:
        DATABASE_PATH: "{{ nd_db_path }}"
      notify: Restart nd_reaper

    - name: Install the nd-nope helper
      ansible.builtin.template:
        src: nd-nope.j2
        dest: /usr/local/bin/nd-nope
        mode: "0755"
      become: true

    - name: Copy the reaper systemd service
      ansible.builtin.template:
        src: nd_reaper.service.j2
        dest: /etc/systemd/system/nd_reaper.service
        mode: "0644"
      become: true
      notify: Restart nd_reaper

    - name: Start and enable the reaper
      ansible.builtin.systemd:
        name: nd_reaper.service
        enabled: true
        state: started
        daemon_reload: true
      become: true

# ── beets ────────────────────────────────────────────────────────────────────
# The distro package was 1.6.0, never configured and with an empty library.
- name: Remove the distro beets package
  ansible.builtin.apt:
    name: beets
    state: absent
  become: true

- name: Install beets
  block:
    - name: Ensure the beets directory exists
      ansible.builtin.file:
        path: "{{ nd_beets_dir }}"
        state: directory
        mode: "0755"

    - name: Install beets into its own venv
      ansible.builtin.pip:
        name: "beets[lastgenre]=={{ nd_beets_version }}"
        virtualenv: "{{ nd_beets_venv }}"
        virtualenv_command: python3 -m venv

    - name: Ensure the beets config directory exists
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.config/beets"
        state: directory
        mode: "0755"

    # The default location, so a bare `beet` finds it.
    - name: Copy the beets config
      ansible.builtin.template:
        src: beets.yaml.j2
        dest: "{{ ansible_env.HOME }}/.config/beets/config.yaml"
        mode: "0644"

    - name: Link beet onto the PATH
      ansible.builtin.file:
        src: "{{ nd_beets_venv }}/bin/beet"
        dest: /usr/local/bin/beet
        state: link
      become: true
