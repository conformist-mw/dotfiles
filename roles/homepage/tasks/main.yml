# --- CrowdSec widget credentials ---------------------------------------------
# Only on a host that runs CrowdSec natively, which is why the machine name is
# set where the role is invoked rather than defaulted here. The widget gets a
# watcher of its own instead of borrowing the web UI's, so revoking one does not
# blind the other. Generated once and kept in the data dir, never in the repo.
- name: Provision the CrowdSec watcher for the homepage widget
  when: homepage_crowdsec_machine is defined
  block:
    - name: Check for existing CrowdSec watcher credentials
      ansible.builtin.stat:
        path: "{{ app_data_dir }}/crowdsec.env"
      register: homepage_crowdsec_env

    - name: Register the CrowdSec watcher
      when: not homepage_crowdsec_env.stat.exists
      block:
        - name: Generate a watcher password
          ansible.builtin.command: openssl rand -hex 24
          register: homepage_crowdsec_pw
          changed_when: true

        - name: Register the watcher machine in CrowdSec LAPI
          # --file /dev/null is not optional next to --force: without it cscli
          # dumps the generated credentials over its default path, which is the
          # native agent's own /etc/crowdsec/local_api_credentials.yaml, and
          # silently repoints the agent at this identity on its next restart.
          ansible.builtin.command: >-
            cscli machines add {{ homepage_crowdsec_machine }}
            --password {{ homepage_crowdsec_pw.stdout }} --force
            --file /dev/null
          become: true

        - name: Persist the watcher password
          ansible.builtin.copy:
            dest: "{{ app_data_dir }}/crowdsec.env"
            content: "{{ homepage_crowdsec_pw.stdout }}"
            mode: "0600"
          become: true

    - name: Read the watcher password back
      ansible.builtin.slurp:
        src: "{{ app_data_dir }}/crowdsec.env"
      register: homepage_crowdsec_slurp
      become: true

    - name: Hand the password to the config template
      ansible.builtin.set_fact:
        homepage_crowdsec_password: "{{ homepage_crowdsec_slurp.content | b64decode | trim }}"
      no_log: true

- name: Copy homepage services
  ansible.builtin.template:
    src: "{{ path_prefix }}{{ item }}.yaml"
    dest: "{{ app_data_dir }}/config/{{ item }}.yaml"
  loop:
    - "bookmarks"
    - "docker"
    - "services"
    - "settings"
    - "widgets"
  become: true

- name: Copy favicon
  ansible.builtin.copy:
    src: "{{ path_prefix }}favicon.ico"
    dest: "{{ app_data_dir }}/images/favicon.ico"
  become: true

- name: fix permissions
  ansible.builtin.file:
    path: "{{ app_data_dir }}"
    state: directory
    mode: 0755
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  become: true

- name: Include labels generator
  ansible.builtin.include_role:
    name: labels_generator
  vars:
    additional_labels:
      - key: "traefik.http.routers.{{ app_name }}.rule"
        value: "Host(`{{ hostname_prefix }}{{ ansible_host }}`)"

- name: homepage container
  community.docker.docker_container:
    name: "{{ app_name }}"
    image: ghcr.io/gethomepage/homepage:v2.2.0
    restart: true
    restart_policy: "unless-stopped"
    networks:
      - name: "{{ docker_network }}"
    env:
      HOMEPAGE_ALLOWED_HOSTS: "{{ hostname_prefix }}{{ ansible_host }}"
    volumes:
      - "{{ app_data_dir }}/config:/app/config"
      - "{{ app_data_dir }}/images:/app/public/images"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    labels: "{{ labels }}"
