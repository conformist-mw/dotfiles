- resources: false

- glances:
    url: "http://{{ docker_gateway }}:61208"
    version: 4
    cpu: true
    mem: true
    uptime: true
    cputemp: true
    disk:
      - /
      - /mnt/ssd
      - /mnt/hdd
    label: Beelink

- search:
    provider: google
    target: _blank

# openmeteo needs no API key at all, which is the whole reason it is here
# instead of openweathermap — one less secret and one less account to keep.
- openmeteo:
    label: "Dnipro"
    latitude: 48.45
    longitude: 34.9833
    timezone: Europe/Kyiv
    units: metric
    cache: 5
