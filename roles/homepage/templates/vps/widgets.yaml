# Built-in, read from inside the container — no host agent. History and
# alerts live in Beszel.
- resources:
    label: Hetzner
    cpu: true
    memory: true
    uptime: true
    disk: /

- search:
    provider: google
    target: _blank

# openmeteo needs no API key at all, which is the whole reason it is here
# instead of openweathermap — one less secret and one less account to keep.
- openmeteo:
    label: "Dnipro"
    latitude: 48.45
    longitude: 34.9833
    timezone: Europe/Kyiv
    units: metric
    cache: 5
