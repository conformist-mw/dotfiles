---
- name: Ensure the apt keyrings dir exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Add Docker GPG key
  # Plain download of the armored key, NOT ansible.builtin.apt_key: that module shells
  # out to `apt-key`, which Debian 13 (apt 3.0) no longer ships. apt reads .asc directly
  # via signed-by, so no dearmoring step is needed.
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Drop the old apt-key keyring
  # Left behind by the previous apt_key-based task; nothing references it anymore.
  ansible.builtin.file:
    path: /etc/apt/keyrings/docker.gpg
    state: absent
  become: true

- name: Add apt repo
  ansible.builtin.apt_repository:
    repo: deb [arch={{ [ansible_architecture] | map('extract', deb_architecture) | first }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable
    state: present
    filename: docker
  vars:
    deb_architecture: { "aarch64": "arm64", "x86_64": "amd64" }
  become: true

- name: install docker, containerd.oi
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: latest
    update_cache: yes
  become: true

- name: start and enable docker daemon
  become: true
  ansible.builtin.service:
    name: docker
    state: started
    enabled: yes

- name: start and enable containerd daemon
  become: true
  ansible.builtin.service:
    name: containerd
    state: started
    enabled: yes

- name: add docker group
  become: true
  ansible.builtin.group:
    name: docker
    state: present

- name: add user to the docker group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: yes
  become: true

- name: Create a network for docker
  community.docker.docker_network:
    name: "{{ docker_network }}"
    driver: bridge
    driver_options:
      com.docker.network.bridge.name: "{{ docker_network }}"
    ipam_config:
      - subnet: "{{ docker_subnet }}"
  become: true
