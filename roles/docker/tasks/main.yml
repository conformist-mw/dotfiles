---
- name: Ensure the apt keyrings dir exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Add Docker GPG key
  # Plain download of the armored key, NOT ansible.builtin.apt_key: that module shells
  # out to `apt-key`, which Debian 13 (apt 3.0) no longer ships. apt reads .asc directly
  # via signed-by, so no dearmoring step is needed.
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Add apt repo
  # Own the file outright (same shape as roles/crowdsec and roles/speedtest) instead of
  # ansible.builtin.apt_repository. That module matches an entry by its FULL option set,
  # so changing signed-by appends a SECOND line rather than rewriting the first — and apt
  # then refuses to read ANY source ("Conflicting values set for option Signed-By"),
  # breaking every later apt task on the host. Reproduced on the rehearsal box.
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.list
    content: "deb [arch={{ [ansible_architecture] | map('extract', deb_architecture) | first }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable\n"
    owner: root
    group: root
    mode: "0644"
  vars:
    deb_architecture: { "aarch64": "arm64", "x86_64": "amd64" }
  become: true

- name: install docker, containerd.oi
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: latest
    update_cache: yes
  become: true

- name: Drop the old apt-key keyring
  # Deliberately AFTER the install task: that task refreshes the cache against the
  # rewritten docker.list, so by the time this runs nothing references docker.gpg and a
  # failed refresh leaves the old key in place to fall back on.
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/keyrings/docker.gpg
    - /etc/apt/keyrings/docker.gpg~ # apt_key's backup file, same vintage
  become: true

- name: start and enable docker daemon
  become: true
  ansible.builtin.service:
    name: docker
    state: started
    enabled: yes

- name: start and enable containerd daemon
  become: true
  ansible.builtin.service:
    name: containerd
    state: started
    enabled: yes

- name: add docker group
  become: true
  ansible.builtin.group:
    name: docker
    state: present

- name: add user to the docker group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: yes
  become: true

- name: Create a network for docker
  community.docker.docker_network:
    name: "{{ docker_network }}"
    driver: bridge
    driver_options:
      com.docker.network.bridge.name: "{{ docker_network }}"
    ipam_config:
      - subnet: "{{ docker_subnet }}"
  become: true
